<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Weather information with current conditions, five-day forecast, unit conversion, and recent searches." />
    <meta name="theme-color" content="#249be7" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Weather App</title>
  </head>
  <body>
    <div id="app">
      <main class="shell">
        <header class="topbar">
          <div class="brand">
            <div class="brand-mark" aria-hidden="true">☀️</div>
            <h1>Weather App</h1>
          </div>
        </header>

        <section class="search-card" aria-label="Weather search">
          <div class="search-box">
            <form id="searchForm" class="search-form">
            <label class="sr-only" for="cityInput">City or coordinates</label>
            <input
              id="cityInput"
              name="city"
              type="search"
              autocomplete="off"
              placeholder="Enter city name or coordinates (lat,lng)"
              required
            />
            <button type="submit">Search</button>
            </form>
            <div id="suggestions" class="suggestions" role="listbox" aria-label="Location suggestions"></div>
          </div>
          <p id="message" class="message" role="status" aria-live="polite"></p>
        </section>

        <section id="weatherPanel" class="weather-panel" aria-live="polite">
          <div class="location-row">
            <div class="location-heading">
              <div class="location-title">
                <p id="locationName" class="location-name">Manila</p>
                <button id="unitToggle" class="unit-toggle" type="button" aria-label="Toggle temperature unit">°C</button>
              </div>
              <p id="locationMeta" class="location-meta">Enter a city to load weather information</p>
            </div>
            <p id="updatedAt" class="updated-at">—</p>
          </div>

          <div class="current-card">
            <div class="temperature-line">
              <span id="temperature">--</span>
              <span id="temperatureUnit">°C</span>
            </div>

            <div class="current-summary">
              <div id="currentIcon" class="current-icon" aria-hidden="true">🌤️</div>
              <p id="condition">Ready for a search</p>
              <p id="feelsLike">Feels like --</p>
            </div>

            <div class="metrics-grid">
              <article class="metric">
                <span>Humidity</span>
                <strong id="humidity">--</strong>
                <small>%</small>
              </article>
              <article class="metric">
                <span>Wind Speed</span>
                <strong id="wind">--</strong>
                <small>km/h</small>
              </article>
              <article class="metric">
                <span>Pressure</span>
                <strong id="pressure">--</strong>
                <small>hPa</small>
              </article>
              <article class="metric">
                <span>Visibility</span>
                <strong id="visibility">--</strong>
                <small>km</small>
              </article>
            </div>
          </div>

          <section class="forecast-section">
            <div class="section-heading">
              <h3>5-Day Forecast</h3>
              <span id="timezone">—</span>
            </div>
            <div id="forecast" class="forecast-grid"></div>
          </section>

          <section class="history-section">
            <div class="section-heading">
              <h3>Recent Searches</h3>
              <button id="clearHistory" class="text-button" type="button">Clear History</button>
            </div>
            <div id="history" class="history-list"></div>
          </section>
        </section>

        <footer>
          <span>Engr. Blademir Rubia</span>
          <span>Weather data: Open-Meteo · CC BY 4.0</span>
        </footer>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
